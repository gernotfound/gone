name: One-shot bionic spider enemies

on:
  push:
    branches:
      - chore/vercel-main-only-deploys
    paths:
      - .github/workflows/one-shot-bionic-spiders.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chore/vercel-main-only-deploys
          fetch-depth: 0

      - name: Apply bionic spider implementation
        shell: bash
        run: |
          python3 .github/apply_bionic_spiders.py
          sed -i 's/private updateLegs(enemy: EnemyState, delta: number,/private updateLegs(enemy: EnemyState, _delta: number,/' game-web/src/gameplay/bionicSpiderEnemies.ts

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        run: npm run build --prefix game-web

      - name: Full E2E suite
        run: node tests/e2e_runner.mjs

      - name: Commit verified feature and remove one-shot tooling
        shell: bash
        run: |
          rm -f .github/apply_bionic_spiders.py .github/workflows/one-shot-bionic-spiders.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add terrain-aware bionic spider enemies'
          git push origin HEAD:chore/vercel-main-only-deploys
