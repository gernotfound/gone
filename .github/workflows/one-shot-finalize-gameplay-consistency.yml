name: One-shot finalize gameplay consistency

on:
  push:
    branches:
      - chore/vercel-main-only-deploys
    paths:
      - scripts/one_shot_finalize_gameplay_consistency.py
      - .github/workflows/one-shot-finalize-gameplay-consistency.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/vercel-main-only-deploys
          fetch-depth: 0

      - name: Apply consistency patch
        run: python3 scripts/one_shot_finalize_gameplay_consistency.py

      - name: Diff integrity
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        run: npm run build --prefix game-web

      - name: Full E2E suite
        run: node tests/e2e_runner.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust native suite
        run: cargo test --manifest-path game-core/Cargo.toml

      - name: Rust WASM target
        run: cargo check --manifest-path game-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Commit verified result and remove one-shot files
        shell: bash
        run: |
          rm -f scripts/one_shot_finalize_gameplay_consistency.py
          rm -f .github/workflows/one-shot-finalize-gameplay-consistency.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "fix: finalize authoritative gameplay consistency"
          git push origin HEAD:chore/vercel-main-only-deploys
