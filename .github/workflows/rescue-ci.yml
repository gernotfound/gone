name: GONE Rescue CI

on:
  push:
    branches:
      - rescue-playable-v0-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix game-web 2>&1 | tee rescue-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-build-log
          path: rescue-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Existing E2E/model suites
        id: legacy_e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tests/e2e_runner.mjs 2>&1 | tee rescue-e2e.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-e2e-log
          path: rescue-e2e.log
          if-no-files-found: warn
          retention-days: 3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust core tests
        id: rust_core
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path game-core/Cargo.toml 2>&1 | tee rescue-rust.log

      - name: Upload Rust log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-rust-log
          path: rescue-rust.log
          if-no-files-found: warn
          retention-days: 3

      - name: Final quality gate
        if: always()
        shell: bash
        run: |
          echo "Legacy E2E outcome: ${{ steps.legacy_e2e.outcome }}"
          echo "Rust outcome: ${{ steps.rust_core.outcome }}"
          test "${{ steps.legacy_e2e.outcome }}" = "success"
          test "${{ steps.rust_core.outcome }}" = "success"
