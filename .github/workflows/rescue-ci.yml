name: GONE Rescue CI

on:
  push:
    branches:
      - rescue-playable-v0-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        run: npm run build --prefix game-web

      - name: Existing E2E/model suites
        run: node tests/e2e_runner.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust core tests
        run: cargo test --manifest-path game-core/Cargo.toml
