name: GONE Rescue CI

on:
  push:
    branches:
      - rescue-playable-v0-1
      - rescue-playable-v0-2
      - selfhost-v0-3
      - playable-final-v0-5
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: Install local host dependencies
        run: npm install --prefix gone-host --ignore-scripts

      - name: TypeScript and Vite build
        shell: bash
        run: |
          set -o pipefail
          npm run build --prefix game-web 2>&1 | tee rescue-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-build-log
          path: rescue-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Existing E2E/model suites
        id: legacy_e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tests/e2e_runner.mjs 2>&1 | tee rescue-e2e.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-e2e-log
          path: rescue-e2e.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install browser smoke dependencies
        shell: bash
        run: |
          cd game-web
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Real browser multiplayer smoke
        id: browser_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd game-web
          npm run preview -- --host 127.0.0.1 --port 4173 > ../rescue-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/rescue_browser_smoke.mjs 2>&1 | tee ../rescue-browser-smoke.log
          node scripts/rescue_webrtc_scale_smoke.mjs 2>&1 | tee ../rescue-webrtc-scale.log
          node scripts/rescue_combat_network_smoke.mjs 2>&1 | tee ../rescue-combat-network.log
          node scripts/rescue_session_resilience_smoke.mjs 2>&1 | tee ../rescue-session-resilience.log
          node scripts/rescue_selfhost_relay_smoke.mjs 2>&1 | tee ../rescue-selfhost-relay.log
          node scripts/rescue_selfhost_scale_smoke.mjs 2>&1 | tee ../rescue-selfhost-scale.log
          node scripts/rescue_full_match_smoke.mjs 2>&1 | tee ../rescue-full-match.log
          node scripts/mobile_pwa_smoke.mjs 2>&1 | tee ../rescue-mobile-pwa.log
          node scripts/competitive_mobile_controls_smoke.mjs 2>&1 | tee ../rescue-competitive-mobile.log

      - name: Upload browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-browser-smoke-log
          path: |
            rescue-browser-smoke.log
            rescue-webrtc-scale.log
            rescue-combat-network.log
            rescue-session-resilience.log
            rescue-selfhost-relay.log
            rescue-selfhost-scale.log
            rescue-full-match.log
            rescue-mobile-pwa.log
            rescue-competitive-mobile.log
            rescue-preview.log
          if-no-files-found: warn
          retention-days: 3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust core tests
        id: rust_core
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path game-core/Cargo.toml 2>&1 | tee rescue-rust.log

      - name: Upload Rust log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-rust-log
          path: rescue-rust.log
          if-no-files-found: warn
          retention-days: 3

      - name: Final quality gate
        if: always()
        shell: bash
        run: |
          echo "Legacy E2E outcome: ${{ steps.legacy_e2e.outcome }}"
          echo "Browser smoke outcome: ${{ steps.browser_smoke.outcome }}"
          echo "Rust outcome: ${{ steps.rust_core.outcome }}"
          test "${{ steps.legacy_e2e.outcome }}" = "success"
          test "${{ steps.browser_smoke.outcome }}" = "success"
          test "${{ steps.rust_core.outcome }}" = "success"
