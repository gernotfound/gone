name: One-shot gameplay consistency audit

on:
  push:
    branches:
      - chore/vercel-main-only-deploys

permissions:
  contents: write

jobs:
  align-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited gameplay fixes
        run: python3 tools/one_shot_logic_consistency.py

      - name: Align lifecycle test fixture
        run: python3 tools/one_shot_logic_consistency_followup.py

      - name: Diff sanity
        run: git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        run: npm run build --prefix game-web

      - name: Full E2E/model suites
        run: node tests/e2e_runner.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust core tests
        run: cargo test --manifest-path game-core/Cargo.toml

      - name: Rust WASM compile gate
        run: cargo check --manifest-path game-core/Cargo.toml --target wasm32-unknown-unknown

      - name: Commit verified gameplay fixes and remove one-shot tooling
        shell: bash
        run: |
          rm -f tools/one_shot_logic_consistency.py tools/one_shot_logic_consistency_followup.py .github/workflows/one-shot-logic-consistency.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align authoritative gameplay logic"
          git push origin HEAD:chore/vercel-main-only-deploys
