name: Firestore Live Signaling Smoke

on:
  push:
    branches:
      - feat/stable-internet-multiplayer

permissions:
  contents: read

jobs:
  live-firestore-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate create/get/update/list-deny/delete lifecycle
        shell: bash
        run: |
          node <<'NODE'
          const { randomBytes } = require('node:crypto');

          const projectId = 'gone-29c51';
          const collection = 'gone_signaling_rooms_v1';
          const roomId = randomBytes(16).toString('hex');
          const base = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`;
          const documentUrl = `${base}/${collection}/${roomId}`;
          const collectionUrl = `${base}/${collection}?documentId=${roomId}`;

          async function request(url, init = {}) {
            const response = await fetch(url, {
              ...init,
              headers: {
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const text = await response.text();
            return { response, text };
          }

          function assertStatus(actual, expected, label, body) {
            if (actual !== expected) {
              throw new Error(`${label}: expected HTTP ${expected}, got ${actual}. ${body.slice(0, 500)}`);
            }
          }

          (async () => {
            let created = false;
            try {
              const now = Date.now();
              const createBody = {
                fields: {
                  v: { integerValue: '1' },
                  offer: { stringValue: 'gone-live-smoke-offer-1234567890' },
                  answer: { stringValue: '' },
                  status: { stringValue: 'waiting' },
                  createdAtMs: { integerValue: String(now) },
                  updatedAtMs: { integerValue: String(now) },
                  expiresAtMs: { integerValue: String(now + 120000) },
                },
              };

              let result = await request(collectionUrl, {
                method: 'POST',
                body: JSON.stringify(createBody),
              });
              assertStatus(result.response.status, 200, 'create', result.text);
              created = true;

              result = await request(documentUrl);
              assertStatus(result.response.status, 200, 'get', result.text);

              const updateBody = {
                fields: {
                  answer: { stringValue: 'gone-live-smoke-answer-1234567890' },
                  status: { stringValue: 'answered' },
                  updatedAtMs: { integerValue: String(Date.now()) },
                },
              };
              const updateUrl = `${documentUrl}?updateMask.fieldPaths=answer&updateMask.fieldPaths=status&updateMask.fieldPaths=updatedAtMs`;
              result = await request(updateUrl, {
                method: 'PATCH',
                body: JSON.stringify(updateBody),
              });
              assertStatus(result.response.status, 200, 'update', result.text);

              result = await request(`${base}/${collection}`);
              assertStatus(result.response.status, 403, 'list must be denied', result.text);

              result = await request(documentUrl, { method: 'DELETE' });
              assertStatus(result.response.status, 200, 'delete', result.text);
              created = false;

              result = await request(documentUrl);
              assertStatus(result.response.status, 403, 'get after delete must stay denied', result.text);

              console.log(JSON.stringify({
                projectId,
                collection,
                create: 200,
                get: 200,
                update: 200,
                list: 403,
                delete: 200,
                getAfterDelete: 403,
              }));
            } finally {
              if (created) {
                await request(documentUrl, { method: 'DELETE' }).catch(() => {});
              }
            }
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
