name: One-shot local muzzle socket fix

on:
  push:
    branches:
      - chore/vercel-main-only-deploys
    paths:
      - .github/patch_local_muzzle.py
      - .github/workflows/one-shot-local-muzzle-fix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chore/vercel-main-only-deploys
          fetch-depth: 0

      - name: Apply explicit local muzzle fix
        run: python3 .github/patch_local_muzzle.py

      - name: Verify local engine path is explicit
        run: |
          grep -q "spawnLocalMuzzleFlash(currentWeaponType)" game-web/src/gameplay/engine.ts
          ! grep -q "LOCAL_MUZZLE_MATCH_TOLERANCE_SQ" game-web/src/vfx/vfxManager.ts
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix game-web

      - name: TypeScript and Vite build
        run: npm run build --prefix game-web

      - name: Full E2E suite
        run: node tests/e2e_runner.mjs

      - name: Commit verified fix and remove one-shot tooling
        shell: bash
        run: |
          rm .github/patch_local_muzzle.py .github/workflows/one-shot-local-muzzle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src/vfx/vfxManager.ts game-web/src/gameplay/localMuzzleFlashBinding.ts game-web/src/gameplay/engine.ts tests/tier1_features/test_t1_vfx_pool.mjs .github/patch_local_muzzle.py .github/workflows/one-shot-local-muzzle-fix.yml
          git commit -m "fix: anchor local muzzle flash to weapon socket"
          git push origin HEAD:chore/vercel-main-only-deploys
