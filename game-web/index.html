<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G.O.N.E.</title>
  </head>
  <body class="bg-slate-950 text-white font-sans antialiased min-h-screen w-full flex items-center justify-center select-none">
    
    <!-- AUDIO -->
    <audio id="bg-music" src="/Colossus March.mp3" loop></audio>

    <div id="app" class="w-full h-full absolute inset-0 flex items-center justify-center">
      <!-- MAIN MENU -->
      <div id="main-menu" class="flex flex-col items-center bg-slate-900/80 p-12 rounded-[2rem] border border-slate-700/50 box-glow backdrop-blur-md shadow-2xl relative z-10 w-full max-w-md transition-all duration-300">
        
        <h1 class="text-7xl font-black tracking-tighter mb-12 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 drop-shadow-[0_4px_12px_rgba(139,92,246,0.5)] uppercase italic">
          G.O.N.E.
        </h1>

        <div class="flex flex-col gap-4 w-full">
          <button id="btn-enter" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-500/20 uppercase tracking-widest border border-blue-400/30">
            ENTRA
          </button>
          
          <button id="btn-music-toggle" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 hover:border-slate-500 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md flex items-center justify-center gap-2">
            VOLUME <span id="music-status" class="text-emerald-400">ON</span>
          </button>

          <button id="btn-settings" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 hover:border-slate-500 text-slate-300 font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md">
            IMPOSTAZIONI
          </button>
        </div>
      </div>

      <!-- SETTINGS MENU -->
      <div id="settings-menu" class="hidden flex-col items-center bg-slate-900/90 p-10 rounded-[2rem] border border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.15)] backdrop-blur-md relative z-20 w-full max-w-md transition-all duration-300">
        <h2 class="text-3xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">IMPOSTAZIONI</h2>
        
        <div class="w-full flex flex-col gap-6 mb-8">
          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Volume Generale <span id="val-master" class="text-emerald-400">100%</span>
            </label>
            <input type="range" id="vol-master" min="0" max="100" value="100" class="w-full accent-emerald-500">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Musica <span id="val-music" class="text-blue-400">100%</span>
            </label>
            <input type="range" id="vol-music" min="0" max="100" value="100" class="w-full accent-blue-500">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Effetti <span id="val-sfx" class="text-purple-400">100%</span>
            </label>
            <input type="range" id="vol-sfx" min="0" max="100" value="100" class="w-full accent-purple-500">
          </div>
        </div>

        <button id="btn-back" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md uppercase tracking-wider">
          INDIETRO
        </button>
      </div>
      
      <!-- GAME OVERLAY (Hidden by default) -->
      <div id="game-ui" class="hidden absolute inset-0 pointer-events-none">
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-blue-400/80 rounded-full shadow-[0_0_6px_rgba(59,130,246,0.8)]"></div>
        </div>
        <div class="absolute top-4 left-4 flex flex-col gap-1 drop-shadow-md pointer-events-none">
            <div class="text-emerald-400 font-mono font-bold text-lg">
                G.O.N.E. <span class="text-slate-500 mx-1">|</span> <span id="fps-counter">60</span> FPS
            </div>
            <div id="network-status" class="flex items-center gap-2 bg-slate-900/60 px-2 py-1 rounded border border-slate-700/50 w-fit backdrop-blur-sm">
                <div id="net-dot" class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_5px_rgba(16,185,129,0.8)]"></div>
                <span id="net-text" class="text-xs font-bold text-slate-300 uppercase tracking-wider">ONLINE</span>
            </div>
        </div>
      </div>
    </div>
    
    <!-- RENDER CANVAS (For later) -->
    <canvas id="game-canvas" class="hidden absolute inset-0 w-full h-full z-0"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
