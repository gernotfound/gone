<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#020617" />
    <meta name="application-name" content="G.O.N.E." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="G.O.N.E." />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>G.O.N.E.</title>
  </head>
  <body class="bg-slate-950 text-white font-sans antialiased min-h-screen w-full flex items-center justify-center select-none">
    
    <!-- AUDIO -->
    <audio id="bg-music" src="/Colossus March.mp3" loop></audio>

    <div id="app" class="w-full h-full absolute inset-0 flex items-center justify-center">
      
      <!-- LOADING SCREEN -->
      <div id="loading-screen" class="hidden absolute inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center mb-8">
            <div class="absolute w-24 h-24 border-t-4 border-blue-500 border-solid rounded-full animate-spin"></div>
            <div class="absolute w-16 h-16 border-b-4 border-emerald-500 border-solid rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
        </div>
        <h1 class="text-3xl font-black tracking-widest text-white mb-6 uppercase">
          Costruzione Mondo
        </h1>
        <div class="w-80 h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
            <div id="loading-bar" class="h-full bg-gradient-to-r from-blue-500 to-emerald-500 w-0 transition-all duration-300"></div>
        </div>
        <div id="loading-text" class="mt-4 text-emerald-400 font-mono text-sm tracking-widest font-bold">CARICAMENTO RISORSE 0%</div>
      </div>

      <!-- MAIN MENU -->
      <div id="main-menu" class="flex flex-col items-center bg-slate-900/80 p-12 rounded-[2rem] border border-slate-700/50 box-glow backdrop-blur-md shadow-2xl relative z-10 w-full max-w-md max-h-[90vh] overflow-y-auto transition-all duration-300">
        
        <h1 class="text-7xl font-black tracking-tighter mb-12 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 drop-shadow-[0_4px_12px_rgba(139,92,246,0.5)] uppercase italic">
          G.O.N.E.
        </h1>

        <div class="flex flex-col gap-4 w-full">
          <button id="btn-enter" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-black text-xl py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-500/20 uppercase tracking-widest border border-blue-400/30">
            ENTRA
          </button>
          
          <button id="btn-multiplayer" class="w-full bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-400 hover:to-pink-500 text-white font-black text-xl py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-purple-500/20 uppercase tracking-widest border border-purple-400/30">
            MULTIPLAYER
          </button>
          
          <button id="btn-music-toggle" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 hover:border-slate-500 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md flex items-center justify-center gap-2">
            VOLUME <span id="music-status" class="text-emerald-400">ON</span>
          </button>

          <button id="btn-settings" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 hover:border-slate-500 text-slate-300 font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md">
            IMPOSTAZIONI
          </button>

          <button id="btn-exit" class="hidden w-full bg-red-600/80 border border-red-500/50 hover:bg-red-500 hover:border-red-400 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md">
            ESCI
          </button>
        </div>
      </div>

      <!-- SETTINGS MENU -->
      <div id="settings-menu" class="hidden flex-col items-center bg-slate-900/90 p-10 rounded-[2rem] border border-emerald-500/30 shadow-[0_0_30px_rgba(16,185,129,0.15)] backdrop-blur-md relative z-20 w-full max-w-md max-h-[90vh] overflow-y-auto transition-all duration-300">
        <h2 class="text-3xl font-black mb-8 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">IMPOSTAZIONI</h2>
        
        <div class="w-full flex flex-col gap-6 mb-8">
          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Volume Generale <span id="val-master" class="text-emerald-400">100%</span>
            </label>
            <input type="range" id="vol-master" min="0" max="100" value="100" class="w-full accent-emerald-500">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Musica <span id="val-music" class="text-blue-400">50%</span>
            </label>
            <input type="range" id="vol-music" min="0" max="100" value="50" class="w-full accent-blue-500">
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-slate-400 uppercase tracking-wider flex justify-between">
              Effetti <span id="val-sfx" class="text-purple-400">100%</span>
            </label>
            <input type="range" id="vol-sfx" min="0" max="100" value="100" class="w-full accent-purple-500">
          </div>
        </div>

        <button id="btn-back" class="w-full bg-slate-800 border border-slate-600/50 hover:bg-slate-700 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md uppercase tracking-wider">
          INDIETRO
        </button>
      </div>
      
      <!-- MULTIPLAYER LOBBY -->
      <div id="multiplayer-lobby" class="hidden flex-col items-center bg-slate-900/90 p-10 rounded-[2rem] border border-purple-500/30 shadow-[0_0_30px_rgba(168,85,247,0.15)] backdrop-blur-md relative z-20 w-full max-w-xl max-h-[90vh] overflow-y-auto transition-all duration-300">
        <h2 class="text-3xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 uppercase">LOBBY MULTIPLAYER</h2>
        
        <div class="w-full flex flex-col gap-6 mb-8">
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Nome Utente</label>
                <input type="text" id="player-username" placeholder="Inserisci il tuo nome..." maxlength="15" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors">
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Colore Neon</label>
                <div id="color-picker-container" class="flex flex-wrap gap-3">
                    <!-- Color swatches will be injected here via JS -->
                </div>
            </div>

            <!-- Host only: Invite link -->
            <div id="invite-link-container" class="flex flex-col gap-2 hidden">
                <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Link Invito (Host)</label>
                <div class="flex gap-2">
                    <input type="text" id="invite-link-input" readonly class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-300 font-mono text-sm">
                    <button id="btn-copy-link" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 rounded-xl text-white font-bold transition-colors">COPIA</button>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-400 uppercase tracking-wider">Giocatori nella Lobby</label>
                <ul id="lobby-player-list" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 min-h-[100px] flex flex-col gap-2">
                    <!-- Li elements injected here via JS -->
                </ul>
            </div>
        </div>

        <div class="flex w-full gap-4">
            <button id="btn-back-lobby" class="w-1/3 bg-slate-800 border border-slate-600/50 hover:bg-slate-700 text-white font-bold text-lg py-3 rounded-xl transition-all active:scale-95 shadow-md uppercase tracking-wider">
              INDIETRO
            </button>
            <button id="btn-play-multiplayer" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-xl py-3 rounded-xl transition-all active:scale-95 shadow-lg shadow-emerald-500/20 uppercase tracking-widest border border-emerald-400/30">
              GIOCA
            </button>
        </div>
      </div>
      
      <!-- GAME OVERLAY (Hidden by default) -->
      <div id="game-ui" class="hidden absolute inset-0 pointer-events-none z-10">
        <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-blue-400/80 rounded-full shadow-[0_0_6px_rgba(59,130,246,0.8)]"></div>
        </div>
        <div class="absolute top-4 right-4 flex flex-col items-end gap-1 drop-shadow-md pointer-events-none">
            <div class="text-emerald-400 font-mono font-bold text-lg">
                <span id="fps-counter">60</span> FPS <span class="text-slate-500 mx-1">|</span> G.O.N.E.
            </div>
            <div id="network-status" class="flex items-center gap-2 bg-slate-900/60 px-2 py-1 rounded border border-slate-700/50 w-fit backdrop-blur-sm">
                <span id="net-text" class="text-xs font-bold text-slate-300 uppercase tracking-wider">ONLINE</span>
                <div id="net-dot" class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_5px_rgba(16,185,129,0.8)]"></div>
            </div>
        </div>

        <!-- BOTTOM-LEFT HUD: HEALTH & SHIELD -->
        <div id="health-hud" class="absolute bottom-6 left-8 flex flex-col items-start pointer-events-none font-mono select-none z-20">
            <!-- 10s INVULNERABILITY SHIELD BADGE (Hidden by default) -->
            <div id="hud-shield-badge" class="hidden mb-2 items-center gap-2 px-3 py-1.5 rounded-lg bg-cyan-950/70 border border-cyan-400/80 backdrop-blur-md shadow-[0_0_15px_rgba(0,240,255,0.4)] transition-all duration-200">
                <svg class="w-5 h-5 text-cyan-400 animate-pulse drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4zm0 2.18l7 3.12v4.7c0 4.54-3.14 8.79-7 9.9-3.86-1.11-7-5.36-7-9.9V7.3l7-3.12z"/>
                </svg>
                <span class="text-xs font-black tracking-widest text-cyan-300 uppercase">SCUDO ATTIVO</span>
                <span id="hud-shield-timer" class="text-sm font-black text-cyan-400 font-mono tracking-wider ml-1">10.0s</span>
            </div>

            <!-- HEALTH BAR & NUMERIC READOUT -->
            <div class="flex items-center justify-between w-64 mb-1 text-xs uppercase tracking-widest font-black text-slate-300">
                <span class="flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-sm bg-emerald-400 shadow-[0_0_6px_rgba(16,185,129,0.8)]"></span>
                    INTEGRITÀ SCAFO
                </span>
                <span id="hud-hp-val" class="text-emerald-400 font-black text-base drop-shadow-[0_0_6px_rgba(16,185,129,0.6)]">100 HP</span>
            </div>

            <!-- HEALTH BAR TRACK -->
            <div class="w-64 h-3.5 bg-slate-900/90 rounded-full border border-slate-700/60 p-0.5 shadow-inner box-glow backdrop-blur-sm overflow-hidden">
                <div id="hud-hp-bar" class="h-full rounded-full transition-all duration-200 bg-gradient-to-r from-emerald-500 via-teal-400 to-cyan-400 shadow-[0_0_10px_rgba(16,185,129,0.6)]" style="width: 100%;"></div>
            </div>
        </div>
      </div>

      <!-- 5s DEATH PHASE OVERLAY (Hidden by default) -->
      <div id="death-overlay" class="hidden absolute inset-0 z-40 bg-red-950/40 backdrop-blur-sm flex flex-col items-center justify-center select-none pointer-events-none transition-opacity duration-300">
        <div class="flex flex-col items-center p-8 bg-slate-950/80 border border-red-500/60 rounded-3xl shadow-[0_0_50px_rgba(239,68,68,0.4)]">
            <h2 class="text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-rose-400 to-red-600 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)] uppercase italic mb-4">
                SEI STATO ELIMINATO
            </h2>
            <div class="text-slate-400 font-mono text-sm tracking-widest uppercase mb-4">
                REBOOT SISTEMI IN CORSO...
            </div>
            <div class="text-4xl font-black font-mono text-cyan-400 drop-shadow-[0_0_12px_rgba(0,240,255,0.8)]">
                RESPAWN TRA <span id="death-countdown">5.0</span>s
            </div>
        </div>
      </div>
      <!-- MAP OVERLAY -->
      <div id="map-ui" class="hidden absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center transition-all duration-300">
        <div class="w-[600px] h-[600px] bg-slate-900 border-2 border-emerald-500 rounded-xl shadow-[0_0_30px_rgba(16,185,129,0.3)] relative overflow-hidden">
            <canvas id="minimap-canvas" width="600" height="600" class="w-full h-full bg-slate-950"></canvas>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="player-dot" class="w-5 h-5 bg-red-500 rounded-full shadow-[0_0_15px_rgba(239,68,68,1)] border-2 border-white relative flex items-center justify-center transition-transform">
                    <div class="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-b-[8px] border-b-white absolute -top-1.5"></div>
                </div>
            </div>
            <div class="absolute top-4 left-4 text-emerald-400 font-bold tracking-widest bg-slate-900/90 px-3 py-1 rounded border border-emerald-500/50">MAPPA GLOBALE</div>
            <div class="absolute bottom-4 right-4 text-slate-400 font-mono text-xs">PREMI 'M' PER CHIUDERE</div>
        </div>
      </div>

    </div>
    
    <!-- RENDER CANVAS (For later) -->
    <canvas id="game-canvas" class="hidden absolute inset-0 w-full h-full z-0"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
